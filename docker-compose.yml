```yaml
services:

  db:
    image: postgres:16
    container_name: telecom_postgres
    restart: always

    environment:
      POSTGRES_DB: telecom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: telecom_redis
    restart: always

    ports:
      - "6379:6379"


  api:
    build: .
    container_name: telecom_api
    restart: always

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/telecom_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload


volumes:
  postgres_data:
```
